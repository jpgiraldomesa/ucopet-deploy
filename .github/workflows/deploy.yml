name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Reconstruir todas las imagenes aunque no haya commits nuevos
        type: boolean
        default: false
      todos:
        description: Redesplegar los dos entornos aunque no haya cambios
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/jpgiraldomesa

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      envs: ${{ steps.detect.outputs.envs }}
      builds: ${{ steps.detect.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: detect
        env:
          FORCE_INPUT: ${{ inputs.force }}
          BEFORE: ${{ github.event.before }}
          DEPLOY_ALL: ${{ github.event_name == 'push' || inputs.todos }}
        run: |
          FORCE=false
          [ "$FORCE_INPUT" = true ] && FORCE=true
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE" 2>/dev/null \
             && git diff --name-only "$BEFORE" HEAD | grep -qE '^(docker/|services.txt)'; then
            echo "Cambio la forma de construir: se reconstruye todo"
            FORCE=true
          fi
          FORCE=$FORCE scripts/detect.sh

  build:
    needs: detect
    if: needs.detect.outputs.builds != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: ${{ matrix.svc }} (${{ matrix.env }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: deploy
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: src
      - id: node
        if: matrix.svc == 'front'
        run: echo "version=$(deploy/scripts/node-version.sh src)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: deploy/docker/${{ matrix.svc == 'front' && 'front' || 'spring' }}.Dockerfile
          build-contexts: config=deploy/docker
          build-args: NODE_VERSION=${{ steps.node.outputs.version || '24' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/ucopet-${{ matrix.svc }}:${{ matrix.env }}
            ${{ env.REGISTRY }}/ucopet-${{ matrix.svc }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.sha }}
            ucopet.repo=${{ matrix.repo }}
          cache-from: type=gha,scope=${{ matrix.svc }}-${{ matrix.env }}
          cache-to: type=gha,scope=${{ matrix.svc }}-${{ matrix.env }},mode=max
      - name: Marcar el commit como roto
        if: failure()
        run: |
          printf 'FROM scratch\nLABEL ucopet.repo=%s ucopet.revision=%s\n' "${{ matrix.repo }}" "${{ matrix.sha }}" \
            | docker buildx build --push -t "${{ env.REGISTRY }}/ucopet-${{ matrix.svc }}:failed-${{ matrix.tag }}" -
          echo "**${{ matrix.svc }} (${{ matrix.env }})** no compila en ${{ matrix.repo }}@${{ matrix.sha }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [detect, build]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: ${{ fromJson(needs.detect.outputs.envs) }}
    steps:
      - name: Desplegar ${{ matrix.env }} en la VM
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vm && chmod 600 ~/.ssh/vm
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/vm -o StrictHostKeyChecking=accept-new "$VM" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null \
             && cd /opt/ucopet \
             && { [ -d deploy/.git ] || { rm -rf deploy && git clone -q https://github.com/${{ github.repository }}.git deploy; }; } \
             && cd deploy && git pull -q --ff-only \
             && scripts/deploy.sh ${{ matrix.env }}"
